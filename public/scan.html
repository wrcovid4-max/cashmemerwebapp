<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <title>Cash Memer — phone scanner</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/css/scan.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <strong>Cash Memer</strong>
        <span>phone scanner</span>
      </div>
      <div id="link" class="pill">connecting…</div>
    </header>

    <main>
      <div class="viewport">
        <video id="video" playsinline muted autoplay></video>
        <div class="reticle"><span></span></div>
        <div id="cameraMessage" class="camera-message hidden"></div>
      </div>

      <div id="lastScan" class="last-scan empty">Point the camera at a barcode.</div>

      <form id="manualForm" class="manual">
        <input
          id="manualInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="…or type a barcode by hand"
        />
        <button type="submit" class="send">Send</button>
      </form>

      <div class="row">
        <button id="torchBtn" class="ghost hidden">Torch</button>
        <button id="cameraBtn" class="ghost">Switch camera</button>
      </div>

      <ul id="history" class="history"></ul>

      <p class="note" id="queueNote"></p>
    </main>

    <script type="module" src="/js/scan-phone.js"></script>
  </body>
</html>
